services:
  postgres:
    image: postgres:16-alpine
    container_name: workspace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5438:5432"

    volumes:
      - workspace_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: workspace-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin

      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}

      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_PASSWORD_HASH: ${APP_ADMIN_PASSWORD_HASH}

volumes:
  workspace_postgres_data: