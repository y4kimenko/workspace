spring:
    application:
        name: workspace

    datasource:
        url: jdbc:postgresql://localhost:5438/appdb
        username: admin
        password: admin
        driver-class-name: org.postgresql.Driver

    jpa:
        database: postgresql
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    servlet:
        multipart:
            enabled: true
            max-file-size: 4MB
            max-request-size: 4MB

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}  # твой gmail адрес
        password: ${MAIL_PASSWORD}  # App Password, не обычный пароль!
        properties:
            mail.smtp.auth: true
            mail.smtp.starttls.enable: true